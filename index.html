<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Invention of Morel vs. The Matrix</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --green: #00ff41;
  --green-dim: #00cc34;
  --green-dark: #007a1f;
  --green-ghost: rgba(0,255,65,0.07);
  --red: #ff0033;
  --blue: #0066ff;
  --black: #000;
  --scanline: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
}

*{margin:0;padding:0;box-sizing:border-box}

body {
  background:#000;
  color:var(--green);
  font-family:'Share Tech Mono',monospace;
  overflow:hidden;
  width:100vw;height:100vh;
  cursor:none;
}

/* ── CUSTOM CURSOR ── */
#cursor {
  position:fixed;width:20px;height:20px;
  border:1px solid var(--green);
  border-radius:50%;pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  transition:width .1s,height .1s,border-color .1s;
  mix-blend-mode:screen;
}
#cursor::after {
  content:'';position:absolute;top:50%;left:50%;
  width:4px;height:4px;background:var(--green);
  border-radius:50%;transform:translate(-50%,-50%);
}
body:hover #cursor{opacity:1}

/* ── MATRIX RAIN ── */
#rain-canvas {
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;opacity:.18;pointer-events:none;
}

/* ── SCANLINE OVERLAY ── */
#scanlines {
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:var(--scanline);
  z-index:1;pointer-events:none;opacity:.4;
  animation:scanMove 8s linear infinite;
}
@keyframes scanMove{from{background-position:0 0}to{background-position:0 100%}}

/* ── GLITCH FLASH ── */
#glitch-overlay {
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:2;pointer-events:none;
  background:rgba(0,255,65,0);
  animation:glitchPulse 7s infinite;
}
@keyframes glitchPulse{
  0%,97%{background:rgba(0,255,65,0);clip-path:none}
  97.5%{background:rgba(0,255,65,0.04);clip-path:inset(30% 0 50% 0)}
  98%{background:rgba(255,0,51,0.03);clip-path:inset(60% 0 10% 0)}
  99%{background:rgba(0,255,65,0);clip-path:none}
}

/* ── PRESENTATION SHELL ── */
#pres {
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:3;display:flex;flex-direction:column;
}

/* ── TOPBAR ── */
#topbar {
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px;border-bottom:1px solid rgba(0,255,65,.2);
  background:rgba(0,0,0,.85);backdrop-filter:blur(4px);
  flex-shrink:0;
}
#topbar .logo {
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;
  color:var(--green);opacity:.7;
}
#progress-bar-wrap {
  flex:1;margin:0 20px;height:2px;
  background:rgba(0,255,65,.1);border-radius:2px;overflow:hidden;
}
#progress-bar {
  height:100%;background:var(--green);
  transition:width .4s ease;
  box-shadow:0 0 8px var(--green);
}
#topbar .slide-counter {
  font-size:11px;color:rgba(0,255,65,.5);letter-spacing:2px;min-width:60px;text-align:right;
}

/* ── MAIN SLIDE AREA ── */
#slide-area {
  flex:1;overflow:hidden;position:relative;
}

/* ── SLIDE ── */
.slide {
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:32px 48px;text-align:center;
  opacity:0;pointer-events:none;
  transition:none;
}
.slide.active {opacity:1;pointer-events:all}

/* Transition classes */
.slide.enter-right {animation:enterRight .5s cubic-bezier(.23,1,.32,1) forwards}
.slide.enter-left  {animation:enterLeft  .5s cubic-bezier(.23,1,.32,1) forwards}
.slide.exit-right  {animation:exitRight  .4s ease-in forwards}
.slide.exit-left   {animation:exitLeft   .4s ease-in forwards}

@keyframes enterRight{from{opacity:0;transform:translateX(60px) skewX(-2deg)}to{opacity:1;transform:none}}
@keyframes enterLeft {from{opacity:0;transform:translateX(-60px) skewX(2deg)} to{opacity:1;transform:none}}
@keyframes exitRight {from{opacity:1;transform:none}to{opacity:0;transform:translateX(-40px)}}
@keyframes exitLeft  {from{opacity:1;transform:none}to{opacity:0;transform:translateX(40px)}}

/* ── TYPOGRAPHY ── */
.section-badge {
  font-size:9px;letter-spacing:5px;color:rgba(0,255,65,.45);
  text-transform:uppercase;margin-bottom:14px;
  border:1px solid rgba(0,255,65,.15);padding:4px 14px;display:inline-block;
}
.slide-title {
  font-family:'Orbitron',sans-serif;
  font-size:clamp(20px,3.5vw,40px);
  font-weight:900;color:var(--green);
  line-height:1.15;margin-bottom:16px;
  text-shadow:0 0 30px rgba(0,255,65,.5),0 0 60px rgba(0,255,65,.2);
  animation:titlePulse 4s ease-in-out infinite;
}
@keyframes titlePulse{0%,100%{text-shadow:0 0 30px rgba(0,255,65,.5),0 0 60px rgba(0,255,65,.2)}50%{text-shadow:0 0 50px rgba(0,255,65,.8),0 0 100px rgba(0,255,65,.3)}}

.divider {
  width:80px;height:1px;margin:14px auto;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
}

.body-text {
  font-size:clamp(13px,1.6vw,16px);color:var(--green-dim);
  line-height:1.85;max-width:700px;
}
.body-text b, .body-text strong {color:var(--green);font-weight:400}
.body-text em {color:rgba(0,255,65,.6);font-style:normal}

/* ── PERSON LABEL ── */
.person-label {
  position:absolute;top:14px;left:20px;
  font-size:9px;letter-spacing:3px;color:rgba(0,255,65,.3);
  text-transform:uppercase;
}

/* ── COMPARE GRID ── */
.compare-grid {
  display:grid;grid-template-columns:1fr 1fr;gap:20px;
  width:100%;max-width:720px;margin-top:16px;
}
.cbox {
  border:1px solid rgba(0,255,65,.2);padding:20px;
  border-radius:2px;text-align:left;
  background:rgba(0,255,65,.03);
  transition:border-color .3s,background .3s;
  position:relative;overflow:hidden;
}
.cbox::before {
  content:'';position:absolute;top:0;left:0;width:3px;height:100%;
  background:var(--green);opacity:.4;
}
.cbox:hover{border-color:rgba(0,255,65,.5);background:rgba(0,255,65,.06)}
.cbox h4{color:var(--green);font-size:12px;letter-spacing:2px;margin-bottom:10px;font-family:'Orbitron',sans-serif;font-size:11px}
.cbox p{color:var(--green-dim);font-size:12px;line-height:1.7}

/* ── PILL BUTTONS ── */
.pill-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.pill{
  padding:10px 24px;border-radius:3px;font-family:'Share Tech Mono',monospace;
  font-size:13px;letter-spacing:2px;border:1px solid;cursor:default;
  transition:all .3s;
}
.pill.green{border-color:rgba(0,255,65,.4);color:var(--green);background:rgba(0,255,65,.05)}
.pill.red  {border-color:rgba(255,0,51,.5);color:#ff0033;background:rgba(255,0,51,.05);text-shadow:0 0 10px rgba(255,0,51,.4)}
.pill.blue {border-color:rgba(0,102,255,.5);color:#0099ff;background:rgba(0,102,255,.05);text-shadow:0 0 10px rgba(0,102,255,.4)}

/* ── VIDEO SLIDE ── */
.video-frame {
  width:100%;max-width:640px;
  border:1px solid rgba(0,255,65,.3);
  position:relative;overflow:hidden;
  background:#000;border-radius:2px;
  box-shadow:0 0 30px rgba(0,255,65,.1);
}
.video-frame iframe{display:block;width:100%;aspect-ratio:16/9;border:none}
.video-caption{font-size:11px;color:rgba(0,255,65,.4);letter-spacing:2px;margin-top:10px}

/* ── TERMINAL SLIDE ── */
.terminal {
  width:100%;max-width:640px;text-align:left;
  background:rgba(0,10,0,.9);border:1px solid rgba(0,255,65,.25);
  border-radius:4px;overflow:hidden;
  box-shadow:0 0 40px rgba(0,255,65,.08);
}
.terminal-bar{
  background:rgba(0,255,65,.08);padding:8px 14px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,255,65,.15);
}
.tbar-dot{width:10px;height:10px;border-radius:50%}
.terminal-body{padding:20px 24px;font-size:13px;line-height:2}
.t-prompt{color:rgba(0,255,65,.4)}
.t-cmd{color:var(--green)}
.t-out{color:rgba(0,255,65,.6)}
.t-cursor{display:inline-block;width:8px;height:14px;background:var(--green);animation:blink .8s step-end infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── QUOTE SLIDE ── */
.big-quote {
  font-family:'VT323',monospace;font-size:clamp(22px,3.5vw,42px);
  color:var(--green);line-height:1.4;max-width:700px;
  border-left:3px solid var(--green);padding-left:24px;text-align:left;
  text-shadow:0 0 20px rgba(0,255,65,.3);
}
.big-quote cite{display:block;font-size:14px;color:rgba(0,255,65,.4);margin-top:12px;font-style:normal;letter-spacing:2px}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:640px;margin-top:16px}
.stat-card{
  border:1px solid rgba(0,255,65,.2);padding:20px 16px;text-align:center;
  background:rgba(0,255,65,.03);
  transition:all .3s;
}
.stat-card:hover{border-color:rgba(0,255,65,.5);transform:translateY(-3px)}
.stat-num{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;color:var(--green);display:block;margin-bottom:6px}
.stat-label{font-size:10px;letter-spacing:2px;color:rgba(0,255,65,.45);text-transform:uppercase}

/* ── TIMELINE ── */
.timeline{width:100%;max-width:640px;text-align:left;margin-top:10px}
.tl-item{display:flex;gap:16px;margin-bottom:20px;align-items:flex-start}
.tl-dot{width:10px;height:10px;background:var(--green);border-radius:50%;flex-shrink:0;margin-top:5px;box-shadow:0 0 8px var(--green)}
.tl-line{width:1px;background:rgba(0,255,65,.2);flex-shrink:0;margin:0 4.5px;display:block;height:100%}
.tl-content h5{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--green);margin-bottom:4px;letter-spacing:1px}
.tl-content p{font-size:12px;color:var(--green-dim);line-height:1.6}

/* ── BOTTOM NAV ── */
#nav {
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;border-top:1px solid rgba(0,255,65,.15);
  background:rgba(0,0,0,.9);backdrop-filter:blur(4px);flex-shrink:0;
}
.nav-btn {
  background:transparent;border:1px solid rgba(0,255,65,.3);
  color:var(--green);font-family:'Share Tech Mono',monospace;
  font-size:11px;padding:9px 22px;cursor:pointer;letter-spacing:3px;
  border-radius:2px;transition:all .2s;
  text-transform:uppercase;
}
.nav-btn:hover{background:rgba(0,255,65,.1);border-color:var(--green);box-shadow:0 0 14px rgba(0,255,65,.2)}
.nav-btn:disabled{opacity:.15;cursor:default;box-shadow:none}

#dots-wrap{display:flex;gap:5px;flex-wrap:wrap;max-width:400px;justify-content:center}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(0,255,65,.12);border:1px solid rgba(0,255,65,.25);
  cursor:pointer;transition:all .2s;flex-shrink:0;
}
.dot.active{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot:hover{background:rgba(0,255,65,.4)}

.slide-person-nav {
  font-size:9px;letter-spacing:2px;color:rgba(0,255,65,.3);text-align:center;min-width:80px;
}

/* ── SECTION INTRO SLIDES ── */
.section-intro .slide-title{font-size:clamp(32px,6vw,72px);opacity:0;animation:sectionReveal 1s .2s forwards}
.section-intro .section-badge{opacity:0;animation:sectionReveal 1s .5s forwards}
@keyframes sectionReveal{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ── GLITCH TEXT ── */
.glitch {
  position:relative;display:inline-block;
}
.glitch::before,.glitch::after {
  content:attr(data-text);position:absolute;top:0;left:0;width:100%;
}
.glitch::before{color:#ff003366;animation:glitchA 3s infinite;clip-path:polygon(0 30%,100% 30%,100% 50%,0 50%)}
.glitch::after {color:#0099ff66;animation:glitchB 3s infinite;clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%)}
@keyframes glitchA{0%,90%,100%{transform:none}91%{transform:translate(-3px,-2px)}93%{transform:translate(3px,1px)}95%{transform:none}97%{transform:translate(-2px,2px)}99%{transform:none}}
@keyframes glitchB{0%,90%,100%{transform:none}92%{transform:translate(3px,-1px)}94%{transform:translate(-2px,2px)}96%{transform:none}98%{transform:translate(2px,-1px)}}

/* ── DECODE ANIMATION ── */
@keyframes decode{
  0%{content:'▓▒░█▓▒'}
  20%{content:'R▒░█▓▒'}
  40%{content:'RE░█▓▒'}
  60%{content:'REA█▓▒'}
  80%{content:'REAL▓▒'}
  100%{content:'REALITY'}
}

/* ── PILL EASTER EGG OVERLAY ── */
#pill-overlay {
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:1000;background:#000;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;
}
#pill-overlay.show{display:flex}

.pill-scene {
  display:flex;flex-direction:column;align-items:center;gap:0;
  animation:pillFadeIn 1.5s ease forwards;
}
@keyframes pillFadeIn{from{opacity:0}to{opacity:1}}

.pill-title {
  font-family:'Orbitron',sans-serif;font-size:clamp(14px,2.5vw,22px);
  color:var(--green);letter-spacing:4px;margin-bottom:40px;
  text-shadow:0 0 20px var(--green);
}
.pill-choices {
  display:flex;gap:60px;align-items:center;justify-content:center;margin-bottom:50px;
  flex-wrap:wrap;
}
.pill-btn {
  width:160px;height:70px;border-radius:35px;border:none;
  font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:3px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .3s;
  text-transform:uppercase;font-weight:700;
}
.pill-btn.red-pill{
  background:radial-gradient(ellipse at 40% 35%, #ff6666, #cc0022, #660011);
  color:#fff;box-shadow:0 0 30px rgba(255,0,51,.5);
}
.pill-btn.blue-pill{
  background:radial-gradient(ellipse at 40% 35%, #66aaff, #0044cc, #001166);
  color:#fff;box-shadow:0 0 30px rgba(0,102,255,.5);
}
.pill-btn:hover{transform:scale(1.08) translateY(-3px)}
.pill-btn.red-pill:hover{box-shadow:0 0 60px rgba(255,0,51,.8)}
.pill-btn.blue-pill:hover{box-shadow:0 0 60px rgba(0,102,255,.8)}

.pill-btn::after{
  content:'';position:absolute;top:10px;left:20px;
  width:30px;height:12px;background:rgba(255,255,255,.3);
  border-radius:10px;transform:rotate(-20deg);pointer-events:none;
}

/* ── UNCANNY FACE ── */
#face-container {
  display:none;flex-direction:column;align-items:center;gap:20px;
  animation:faceReveal 2s ease forwards;
}
@keyframes faceReveal{
  0%{opacity:0;transform:scale(1.3)}
  30%{opacity:1;transform:scale(0.98)}
  60%{transform:scale(1.02)}
  100%{opacity:1;transform:scale(1)}
}

#uncanny-face {
  width:220px;height:220px;position:relative;
}

.face-svg {
  width:100%;height:100%;
  filter:drop-shadow(0 0 20px rgba(255,0,51,.6));
  animation:facePulse 2s ease-in-out infinite,faceGlitch 6s infinite;
}
@keyframes facePulse{0%,100%{filter:drop-shadow(0 0 20px rgba(255,0,51,.6))}50%{filter:drop-shadow(0 0 40px rgba(255,0,51,.9))}}
@keyframes faceGlitch{
  0%,85%,100%{transform:none}
  86%{transform:translate(3px,-2px) scaleX(1.02)}
  87%{transform:translate(-3px,1px) scaleX(0.98)}
  88%{transform:none}
  95%{transform:translate(0,2px)}
  96%{transform:none}
}

.eye-left, .eye-right {animation:eyeBlink 4s ease-in-out infinite}
@keyframes eyeBlink{0%,45%,55%,100%{transform:scaleY(1) translateY(0)}47%,53%{transform:scaleY(0.05) translateY(3px)}}

.pupil-left,.pupil-right{animation:eyeMove 5s ease-in-out infinite}
@keyframes eyeMove{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(4px,-2px)}
  40%{transform:translate(-3px,3px)}
  60%{transform:translate(5px,1px)}
  80%{transform:translate(-2px,-3px)}
}

.mouth-path{animation:mouthMove 3s ease-in-out infinite}
@keyframes mouthMove{0%,100%{d:path('M 75 148 Q 110 168 145 148')}40%{d:path('M 75 155 Q 110 140 145 155')}70%{d:path('M 72 150 Q 110 178 148 150')}}

#ai-speech {
  max-width:320px;text-align:center;
  border:1px solid rgba(255,0,51,.3);padding:16px 20px;
  background:rgba(255,0,0,.05);border-radius:2px;
  font-size:13px;color:#ff6666;line-height:1.7;
  animation:speechGlitch 8s infinite;
}
@keyframes speechGlitch{
  0%,90%,100%{filter:none}
  91%{filter:hue-rotate(90deg) brightness(1.3)}
  92%{filter:none}
}

.face-title{
  font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:4px;
  color:rgba(255,0,51,.7);text-transform:uppercase;
  animation:flicker 3s infinite;
}
@keyframes flicker{0%,100%{opacity:.7}45%{opacity:.9}46%{opacity:.2}47%{opacity:.8}90%{opacity:.7}91%{opacity:.15}92%{opacity:.7}}

#pill-back {
  position:absolute;bottom:30px;
  background:transparent;border:1px solid rgba(0,255,65,.2);
  color:rgba(0,255,65,.4);font-family:'Share Tech Mono',monospace;
  font-size:10px;padding:8px 20px;cursor:pointer;letter-spacing:3px;
  border-radius:2px;transition:all .2s;
}
#pill-back:hover{border-color:var(--green);color:var(--green)}

#pill-close{
  position:absolute;top:20px;right:20px;
  background:transparent;border:none;
  color:rgba(0,255,65,.3);font-family:'Share Tech Mono',monospace;
  font-size:20px;cursor:pointer;transition:color .2s;
}
#pill-close:hover{color:var(--green)}

/* ── PILL TRIGGER BTN ── */
#pill-trigger {
  position:fixed;bottom:80px;right:24px;z-index:10;
  background:transparent;border:1px solid rgba(255,0,51,.3);
  color:rgba(255,0,51,.5);font-family:'Share Tech Mono',monospace;
  font-size:9px;padding:7px 14px;cursor:pointer;letter-spacing:2px;
  border-radius:2px;transition:all .3s;text-decoration:none;display:inline-block;
  animation:triggerPulse 4s ease-in-out infinite;
}
#pill-trigger:hover{border-color:rgba(255,0,51,.8);color:#ff0033;background:rgba(255,0,51,.05)}
@keyframes triggerPulse{0%,100%{opacity:.4}50%{opacity:.9}}

/* ── Q&A BOXES ── */
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:720px;margin-top:12px}
.qa-item{
  border:1px solid rgba(0,255,65,.15);padding:16px;border-radius:2px;
  text-align:left;background:rgba(0,255,65,.02);
  transition:all .3s;cursor:default;
}
.qa-item:hover{border-color:rgba(0,255,65,.4);background:rgba(0,255,65,.05);transform:translateX(4px)}
.qa-item p{font-size:12px;color:var(--green-dim);line-height:1.7}
.qa-num{font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(0,255,65,.3);margin-bottom:6px;letter-spacing:2px}

/* ── THANK YOU SLIDE ── */
.ty-glyph{
  font-family:'VT323',monospace;font-size:clamp(60px,12vw,120px);
  color:var(--green);line-height:1;
  text-shadow:0 0 60px rgba(0,255,65,.4);
  animation:tyPulse 3s ease-in-out infinite;
}
@keyframes tyPulse{0%,100%{text-shadow:0 0 60px rgba(0,255,65,.4)}50%{text-shadow:0 0 100px rgba(0,255,65,.7),0 0 160px rgba(0,255,65,.3)}}

/* ── WIPE BG ── */
.bg-grid-slide {
  background-image:
    linear-gradient(rgba(0,255,65,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,65,.03) 1px, transparent 1px);
  background-size:40px 40px;
}

/* AI Speech messages */
.ai-msgs{display:none}

/* Responsive */
@media(max-width:600px){
  .compare-grid,.stats-grid,.qa-grid{grid-template-columns:1fr}
  .pill-choices{gap:30px}
  #pres{font-size:13px}
}
</style>
</head>
<body>

<div id="cursor"></div>
<canvas id="rain-canvas"></canvas>

// ── MATRIX RAIN ──
(function(){
  const canvas = document.getElementById('rain-canvas');
  const ctx = canvas.getContext('2d');
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｦｱｲｳｴｵｶｷｸｹｺ';
  let cols, drops;
  function init(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    cols  = Math.floor(canvas.width / 14);
    drops = Array(cols).fill(1).map(() => Math.random() * -50);
  }
  init();
  window.addEventListener('resize', init);
  setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.055)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = '13px monospace';
    drops.forEach((y, i) => {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.globalAlpha = Math.random() * 0.5 + 0.3;
      ctx.fillText(ch, i * 14, y * 14);
      ctx.globalAlpha = 1;
      if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 0.7;
    });
  }, 35);
})();

// ── RENDER ENGINE ──
let current = 0;
const area = document.getElementById('slide-area');

function buildSlides() {
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    div.id = 'slide-' + i;
    if (s.type === 'bg-grid') div.classList.add('bg-grid-slide');
    if (s.type === 'intro' || s.type === 'ty') div.classList.add('section-intro');
    div.innerHTML = `<div class="person-label">${s.person}</div>${s.html}`;
    area.appendChild(div);
  });
}

function buildDots() {
  const wrap = document.getElementById('dots-wrap');
  wrap.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

function updateUI() {
  document.getElementById('counter').textContent =
    String(current + 1).padStart(2, '0') + ' / ' + slides.length;
  document.getElementById('progress-bar').style.width =
    ((current + 1) / slides.length * 100) + '%';
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === slides.length - 1;
  document.getElementById('person-nav').textContent = slides[current].person;
  buildDots();
}

function goTo(n, dir) {
  if (n === current || n < 0 || n >= slides.length) return;
  const oldEl = document.getElementById('slide-' + current);
  const newEl = document.getElementById('slide-' + n);
  const d = dir !== undefined ? dir : (n > current ? 1 : -1);

  oldEl.classList.remove('active');
  oldEl.className = 'slide ' + (d > 0 ? 'exit-right' : 'exit-left');
  setTimeout(() => { oldEl.className = 'slide'; }, 450);

  newEl.className = 'slide ' + (d > 0 ? 'enter-right' : 'enter-left');
  setTimeout(() => {
    newEl.classList.remove('enter-right', 'enter-left');
    newEl.classList.add('active');
  }, 20);

  current = n;
  updateUI();
}

function go(d) { goTo(current + d, d); }

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});

// ── INIT ──
buildSlides();
updateUI();
</script>
